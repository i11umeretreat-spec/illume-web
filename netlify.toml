[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# deck.i11ume.com отдаёт презентацию
[[redirects]]
  from   = "https://deck.i11ume.com/*"
  to     = "/deck.html"
  status = 200
  force  = true

[[redirects]]
  from   = "http://deck.i11ume.com/*"
  to     = "/deck.html"
  status = 200
  force  = true

# reset.i11ume.com отдаёт страницу практик из public/reset
[[redirects]]
  from   = "https://reset.i11ume.com/*"
  to     = "/reset/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "http://reset.i11ume.com/*"
  to     = "/reset/:splat"
  status = 200
  force  = true

# старый адрес ведёт на новый, чтобы разосланные ссылки не умерли
[[redirects]]
  from   = "https://royalmassage.i11ume.com/*"
  to     = "https://reset.i11ume.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://royalmassage.i11ume.com/*"
  to     = "https://reset.i11ume.com/:splat"
  status = 301
  force  = true

# всё остальное отдаёт приложение
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
